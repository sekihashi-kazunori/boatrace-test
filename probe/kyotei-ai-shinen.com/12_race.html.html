<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b5cad">
<meta property="og:type" content="website">
<meta property="og:site_name" content="競艇AI予想「深淵」">
<meta property="og:title" content="競艇AI予想「深淵」— 展示航走まで見てから、AIが全レースを予想">
<meta property="og:description" content="AIが全レースの3連単を締切前に予想。的中特化型・絞り込み型・一撃重視型の3タイプの買い目と、結果・的中率・回収率をすべて公開します。">
<meta property="og:url" content="https://kyotei-ai-shinen.com/">
<meta property="og:image" content="https://kyotei-ai-shinen.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<title></title>
<link rel="stylesheet" href="assets/style.css?v=51a8481b">
</head>
<body>
<div id="header"></div>
<main><div class="wrap" id="main"><div class="empty">読み込み中…</div></div></main>
<div id="footer"></div>
<script src="assets/app.js?v=b377d486"></script>
<script>
header("home");
(async () => {
  const main = document.getElementById("main");
  const date = qs("d"), code = qs("v"), rn = +qs("r");
  let day;
  try { day = await getJSON(`day_${date}.json`); } catch { return fail(main, "この日の予想はありません"); }
  const r = day.races[`${code}_${rn}`];
  if (!r) return fail(main, "このレースの予想はありません");
  document.title = `${r.venue} ${rn}R ${fmtDate(date, false)}`;
  header("home");
  if (raceStatus(r)) {
    // 【2026-10-21】予想をしなかったレース・中止のレースは、理由だけを出す
    main.innerHTML = `
      <div class="crumb"><a href="index.html?d=${date}${tq()}">${fmtDate(date)}</a> › <a href="venue.html?d=${date}&v=${code}${tq()}">${esc(r.venue)}</a> ›</div>
      <h1>${esc(r.venue)} ${rn}R${grade(r.grade)}</h1>
      <div class="muted" style="margin:-8px 0 12px">${esc(r.title || "")}　締切 ${esc(r.deadline || "-")}</div>
      <div class="card"><div style="display:flex;gap:8px;align-items:center">${resultBadge(r)}<span>${esc(statusText(r))}</span></div>
        ${r.result && r.result.order ? `<p class="muted small">結果：${esc(r.result.order)}(${yen(r.result.payout)})</p>` : ""}</div>`;
    return;
  }

  const bar = (x) => (x == null ? "-" : `<div class="bar"><i style="width:${Math.min(100, x * 100)}%"></i><span>${pct(x)}</span></div>`);
  const absent = new Set(r.absent || []);
  const rows = r.boats.map((b) => `
    <tr class="${b.boat === r.honmei ? "top" : ""}">
      <td>${lane(b.boat)}</td>
      <td class="left racer">${esc(b.name || "-")}<small>${esc(b.class || "")}${b.f ? ` F${b.f}` : ""}${b.l ? ` L${b.l}` : ""}</small></td>
      ${absent.has(b.boat) ? `<td colspan="3">欠場</td>` : `<td>${bar(b.p1)}</td><td>${bar(b.p2)}</td><td>${bar(b.p3)}</td>`}
      <td>${num(b.nat_win)}</td><td>${num(b.loc_win)}</td>
      <td>${b.motor_p2 == null ? "-" : `${num(b.motor_p2, 1)}%`}<br><small class="muted">${b.motor_no ?? ""}号機</small></td>
      <td>${num(b.avg_st)}</td>
    </tr>`).join("");

  const res = r.result;
  const bets = r.top.map((t, i) => `
    <div class="card bet ${res && res.order === t.c ? "hit" : ""}">
      <span class="rank">${i + 1}</span>${combo(t.c)}<span class="muted small">${t.p == null ? "" : pct(t.p)}</span>
    </div>`).join("");

  main.innerHTML = `
    <div class="crumb"><a href="index.html?d=${date}${tq()}">${fmtDate(date)}</a> › <a href="venue.html?d=${date}&v=${code}${tq()}">${esc(r.venue)}</a> ›</div>
    <h1>${esc(r.venue)} ${rn}R${grade(r.grade)}</h1>
    <div class="muted" style="margin:-8px 0 12px">${esc(r.title)}　締切 ${esc(r.deadline || "-")}</div>

    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><div class="muted small">AI本命</div><div style="display:flex;gap:8px;align-items:center;font-size:18px;font-weight:800">${lane(r.honmei)}${esc((r.boats.find((b) => b.boat === r.honmei) || {}).name || "")}</div></div>
      <div style="text-align:right"><div class="muted small">結果</div>
        ${res ? `<div style="display:flex;gap:8px;align-items:center">${combo(res.order)}<span class="payout">${yen(res.payout)}</span>${resultBadge(r)}</div>` : resultBadge(r)}
      </div>
    </div>
    <p class="muted small">予想公開 ${hhmm(r.predicted_at)}(締切前に公開・以後変更なし)</p>

    <h2>AI予測と出走表</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>枠</th><th class="left">選手</th><th>1着</th><th>2連対</th><th>3連対</th><th>全国勝率</th><th>当地勝率</th><th>モーター<br>2連率</th><th>平均ST</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

    ${(r.plans || []).length ? `<h2>買い目</h2><div class="plans">${r.plans.map((pl) => {
      const hit = planHit(r, pl.key);
      if (pl.skip) {
        // 条件に入らないので買わないレース(買い目は出さない)
        const why = pl.key === "narrow" ? "AIの自信が条件に届かないため" : "本命の1着確率が50%を超えるため";
        return `<div class="card plan skipped ${pl.key === T ? "on" : ""}">
          <div class="head"><span class="pname">${esc(pl.name)}</span><span class="badge miss">見送り</span></div>
          <div class="meta">${why}、このレースは買いません。的中特化型の買い目を見てください。</div>
        </div>`;
      }
      return `<div class="card plan ${hit ? "hit" : ""} ${pl.key === T ? "on" : ""}">
        <div class="head"><span class="pname">${esc(pl.name)}</span>${r.result ? (hit ? `<span class="badge hit">的中</span>` : `<span class="badge miss">不的中</span>`) : ""}</div>
        <div class="pl-lines">${planLines(pl).map((l, i) => `<div class="pl-line"><span class="pl-tag">${i ? "押さえ" : "本線"}</span>${formation(l.form)}<span class="muted small">${l.n}点</span></div>`).join("")}</div>
        <div class="meta">合計${pl.n}点　AIの的中見込み ${pct(pl.p)}</div>
        <div class="tickets">${pl.tickets.map((t) => `<span class="tk">${esc(t)}</span>`).join("")}</div>
      </div>`;
    }).join("")}</div>
    <p class="muted small">買い目は、AIの確率が高い組から順に選び、フォーメーションの書き方(本線・押さえ)にまとめています。的中見込みは、AIが出した3連単の確率を、その買い目の分だけ足したものです。絞り込み型はAIの自信が高いレースだけ、一撃重視型は本命の1着確率が50%以下のレースだけ買い、当たれば高配当になる組で作っています。</p>` : ""}

    <h2>直前情報</h2>
    ${preRace(r)}

    <h2>他の券種</h2>
    ${otherBets(r)}

    <h2>3連単 AI確率の順位${r.top.length ? `(上位${r.top.length}点)` : ""}</h2>
    <div class="bet-list">${bets}</div>
    ${res && !res.hit_rank ? `<p class="muted small">結果 ${esc(res.order)} は上位${r.top.length}点に入っていませんでした。</p>` : ""}

    ${r.strategies && r.strategies.length ? `<h2>該当した条件</h2><div class="tags">${r.strategies.map((s) => `<span class="tag">${esc(s)}</span>`).join("")}</div>` : ""}`;
})();

// 展示航走などの直前情報(予想に使ったデータ)
function preRace(r) {
  const pr = r.pre_race;
  if (!pr) return `<p class="muted small">このレースは直前情報の記録がありません。</p>`;
  const st = (x) => (x == null ? "-" : x < 0 ? `F${Math.abs(x).toFixed(2).slice(1)}` : x.toFixed(2).slice(1));
  const best = Math.min(...pr.boats.map((b) => b.ex_time).filter((x) => x));
  const rows = pr.boats.map((b) => `<tr>
      <td>${lane(b.boat)}</td>
      <td>${b.ex_course ? Math.round(b.ex_course) : "-"}</td>
      <td class="${b.ex_time && b.ex_time === best ? "best" : ""}">${num(b.ex_time)}</td>
      <td>${st(b.ex_st)}</td>
      <td>${b.tilt == null ? "-" : b.tilt.toFixed(1)}</td>
      <td>${b.new_prop ? "新" : ""}</td>
    </tr>`).join("");
  // 【2026-10-21】水面気象情報(予想を出した時点の公式の直前情報ページ)。古い記録は風速・波高だけ
  const w = pr.weather || { wind: pr.wind, wave: pr.wave };
  const f1w = (x) => (x == null ? null : Number(x).toFixed(1));
  const chips = [
    w.weather ? ["天候", esc(w.weather)] : null,
    w.temp != null ? ["気温", `${f1w(w.temp)}℃`] : null,
    w.wind != null ? ["風速", `${Math.round(w.wind)}m`] : null,
    w.water_temp != null ? ["水温", `${f1w(w.water_temp)}℃`] : null,
    w.wave != null ? ["波高", `${Math.round(w.wave)}cm`] : null,
  ].filter(Boolean);
  return `${chips.length ? `<div class="wx">${chips.map(([k, v]) => `<span class="wx-item"><small>${k}</small>${v}</span>`).join("")}</div>` : ""}
    <div class="table-wrap"><table class="compact">
      <thead><tr><th>枠</th><th>進入</th><th>展示タイム</th><th>展示ST</th><th>チルト</th><th>ペラ</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="muted small">展示タイムの青字はこのレースで一番速い艇。AIはこの情報まで見てから予想しています。</p>`;
}

// 2連単・2連複・3連複(3連単の確率を足し合わせたもの)
function otherBets(r) {
  const o = r.others;
  if (!o) return `<p class="muted small">このレースは他の券種の記録がありません。</p>`;
  const hit = (r.result && r.result.others) || {};
  const box = (key, name) => `<div class="card ob-box"><div class="ob-name">${name}</div><ol>${(o[key] || []).map((t, i) =>
    `<li class="${hit[key] === i + 1 ? "hit" : ""}"><span class="rank">${i + 1}</span><span class="ob-c">${t.c.split(/[-=]/).map(lane).join(`<span class="sep">${t.c.includes("=") ? "=" : "-"}</span>`)}</span><span class="muted small">${pct(t.p)}</span></li>`).join("")}</ol></div>`;
  return `<div class="ob-grid">${box("exacta", "2連単")}${box("quinella", "2連複")}${box("trio", "3連複")}</div>
    <p class="muted small">3連単120通りの確率を足し合わせて出した、確率の高い順の5点です。</p>`;
}
</script>
</body>
</html>
