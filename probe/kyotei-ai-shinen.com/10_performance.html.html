<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成績</title>
<meta name="description" content="AI予想の3タイプ(的中特化型・絞り込み型・一撃重視型)の的中率・回収率を、日別・会場別にすべて公開しています。">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b5cad">
<meta property="og:type" content="website">
<meta property="og:site_name" content="競艇AI予想「深淵」">
<meta property="og:title" content="競艇AI予想「深淵」— 展示航走まで見てから、AIが全レースを予想">
<meta property="og:description" content="AIが全レースの3連単を締切前に予想。的中特化型・絞り込み型・一撃重視型の3タイプの買い目と、結果・的中率・回収率をすべて公開します。">
<meta property="og:url" content="https://kyotei-ai-shinen.com/">
<meta property="og:image" content="https://kyotei-ai-shinen.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/style.css?v=51a8481b">
</head>
<body>
<div id="header"></div>
<main><div class="wrap" id="main"><div class="empty">読み込み中…</div></div></main>
<div id="footer"></div>
<script src="assets/app.js?v=b377d486"></script>
<script>
header("perf");
(async () => {
  const main = document.getElementById("main");
  let perf;
  try { perf = await getJSON("perf.json"); } catch { return fail(main, "データを読み込めませんでした"); }
  const MIN_DAYS = 7;   // 推移や会場別は、この日数がたまるまで「近日公開」
  const plan = perf.plans.find((p) => p.key === T);
  const pr = (x) => (x == null ? "-" : `${f1(x)}%`);

  if (!perf.days) {
    main.innerHTML = `<h1>成績</h1>
      ${comingSoon("3タイプの成績", "最初の1日分の結果がそろいしだい、的中率・回収率を出します。")}
      ${comingSoon("成績の推移", `${MIN_DAYS}日分そろうと、日ごとの的中率・回収率のグラフを出します。`)}
      ${comingSoon("高配当の的中", "払戻1万円以上の的中が出たら、ここに並べます。")}`;
    return;
  }

  const summary = `<div class="table-wrap"><table>
    <thead><tr><th class="left">タイプ</th><th>レース</th><th>的中</th><th>的中率</th><th>回収率</th><th>平均点数</th><th>直近${perf.last_days}日の回収率</th></tr></thead>
    <tbody>${perf.plans.map((p) => `<tr class="${p.key === T ? "top" : ""}">
      <td class="left"><a href="performance.html?${p.key === "hit" ? "" : `t=${p.key}`}">${esc(p.name)}</a></td>
      <td>${p.total.races}</td><td>${p.total.hits}</td><td>${pr(p.total.rate)}</td><td>${pr(p.total.roi)}</td>
      <td>${p.total.avg_pts ?? "-"}</td><td>${pr(p.last7.roi)}</td></tr>`).join("")}</tbody></table></div>`;

  const daily = plan.daily.length ? `<div class="table-wrap"><table>
    <thead><tr><th class="left">日付</th><th>レース</th><th>的中</th><th>的中率</th><th>払戻 / 購入額</th><th>回収率</th></tr></thead>
    <tbody>${plan.daily.map((d) => `<tr><td class="left"><a href="index.html?d=${d.date}${tq()}">${fmtDate(d.date)}</a></td>
      <td>${d.races}</td><td>${d.hits}</td><td>${pr(d.rate)}</td><td>${yen(d.ret)} / ${yen(d.cost)}</td><td>${pr(d.roi)}</td></tr>`).join("")}</tbody></table></div>` : "";

  const venues = perf.days >= MIN_DAYS ? `<h3>会場別</h3><div class="table-wrap"><table>
    <thead><tr><th class="left">会場</th><th>レース</th><th>的中率</th><th>回収率</th></tr></thead>
    <tbody>${plan.venues.map((v) => `<tr><td class="left">${esc(v.venue)}</td><td>${v.races}</td><td>${pr(v.rate)}</td><td>${pr(v.roi)}</td></tr>`).join("")}</tbody></table></div>`
    : comingSoon("会場別の成績", `会場ごとのレース数がまだ少ないため、${MIN_DAYS}日分そろってから出します(現在${perf.days}日)。`);

  const big = perf.big_hits.length ? `<h2>高配当の的中</h2><div class="card big-hits">${perf.big_hits.map((h) => `
    <a class="bh-row" href="race.html?d=${h.date}&v=${h.venue_code}&r=${h.race_num}">
      <span class="muted small">${fmtDate(h.date, false)}</span><span>${esc(h.venue)} ${h.race_num}R</span>
      ${combo(h.order)}<span class="payout">${yen(h.payout)}</span><span class="muted small">${h.types.map(esc).join("・")}</span>
    </a>`).join("")}</div>`
    : comingSoon("高配当の的中", "払戻1万円以上の的中が出たら、ここに並べます。");

  main.innerHTML = `
    <h1>成績</h1>
    <p class="muted small" style="margin-top:-6px">${fmtDate(perf.first)}〜${fmtDate(perf.last)}(${perf.days}日)</p>
    <h2>3タイプの成績</h2>
    ${summary}
    <div class="note">的中率: 結果がそのタイプの買い目に入っていた割合。回収率: 買い目を1点100円で全レース買ったとした場合の 払戻合計 ÷ 購入額。3連単は売上の約25%が差し引かれて払い戻されるため、回収率は100%を下回るのが普通です。</div>

    <h2>${esc(plan.name)}の詳しい成績</h2>
    ${typeTabs((k) => `performance.html?${k === "hit" ? "" : `t=${k}`}`)}
    ${perf.days >= MIN_DAYS ? `<h3>成績の推移</h3>${trendChart(plan.daily.slice().reverse())}` : comingSoon("成績の推移", `${MIN_DAYS}日分そろうと、日ごとの的中率・回収率のグラフを出します(現在${perf.days}日)。`)}
    <h3>日別</h3>
    ${daily}
    ${venues}

    ${big}`;
})();

// 日ごとの的中率と回収率の折れ線(古い日→新しい日)
function trendChart(days) {
  const W = 640, H = 220, L = 36, R = 12, T = 12, B = 28;
  const xs = (i) => L + (days.length === 1 ? 0 : (i * (W - L - R)) / (days.length - 1));
  const max = Math.max(100, ...days.map((d) => d.roi || 0), ...days.map((d) => d.rate || 0));
  const ys = (v) => T + (H - T - B) * (1 - v / max);
  const line = (key) => days.map((d, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(d[key] || 0).toFixed(1)}`).join(" ");
  const step = max > 300 ? 100 : 50;
  const grid = Array.from({ length: Math.floor(max / step) + 1 }, (_, i) => i * step).map((v) => `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" class="g${v === 100 ? " g100" : ""}"/><text x="${L - 6}" y="${ys(v) + 4}" class="ax" text-anchor="end">${v}%</text>`).join("");
  const labels = days.map((d, i) => (i % Math.ceil(days.length / 7) === 0 || i === days.length - 1)
    ? `<text x="${xs(i)}" y="${H - 8}" class="ax" text-anchor="middle">${fmtDate(d.date, false)}</text>` : "").join("");
  return `<div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="日ごとの的中率と回収率">
      ${grid}${labels}
      <path d="${line("roi")}" class="l-roi"/><path d="${line("rate")}" class="l-rate"/>
    </svg>
    <div class="legend"><span class="k-rate">的中率</span><span class="k-roi">回収率</span><span class="muted small">点線は100%</span></div></div>`;
}
</script>
</body>
</html>
