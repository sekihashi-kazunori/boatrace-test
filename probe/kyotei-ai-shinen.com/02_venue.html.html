<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b5cad">
<meta property="og:type" content="website">
<meta property="og:site_name" content="競艇AI予想「深淵」">
<meta property="og:title" content="競艇AI予想「深淵」— 展示航走まで見てから、AIが全レースを予想">
<meta property="og:description" content="AIが全レースの3連単を締切前に予想。的中特化型・絞り込み型・一撃重視型の3タイプの買い目と、結果・的中率・回収率をすべて公開します。">
<meta property="og:url" content="https://kyotei-ai-shinen.com/">
<meta property="og:image" content="https://kyotei-ai-shinen.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<title></title>
<link rel="stylesheet" href="assets/style.css?v=51a8481b">
</head>
<body>
<div id="header"></div>
<main><div class="wrap" id="main"><div class="empty">読み込み中…</div></div></main>
<div id="footer"></div>
<script src="assets/app.js?v=b377d486"></script>
<script>
header("home");
(async () => {
  const main = document.getElementById("main");
  const date = qs("d"), code = qs("v");
  let day;
  try { day = await getJSON(`day_${date}.json`); } catch { return fail(main, "この日の予想はありません"); }
  const races = Object.values(day.races).filter((r) => r.venue_code === code).sort((a, b) => a.race_num - b.race_num);
  if (!races.length) return fail(main, "この会場の予想はありません");
  const v = races[0];
  document.title = `${v.venue} ${fmtDate(date, false)}`;
  header("home");

  const rows = races.map((r) => {
    const hb = r.boats.find((b) => b.boat === r.honmei) || {};
    const res = r.result;
    return `<div class="card race-card">
      <a class="rc-head" href="race.html?d=${date}&v=${code}&r=${r.race_num}${tq()}">
        <span class="rn">${r.race_num}R</span><span class="muted small">締切 ${esc(r.deadline || "-")}</span>
        ${raceStatus(r) ? "" : `<span class="honmei">本命 ${lane(r.honmei)}<b>${esc(hb.name || "")}</b><span class="muted">${pct(hb.p1)}</span></span>`}
        <span class="more">詳しく ›</span>
      </a>
      ${ticketList(r)}
      <div class="rc-res">${resultBadge(r)}${res && res.order ? `${combo(res.order)}<span class="payout">${yen(res.payout)}</span>` : ""}</div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="crumb"><a href="index.html?d=${date}${tq()}">${fmtDate(date)}</a> ›</div>
    <h1>${esc(v.venue)}${grade(v.grade)}</h1>
    <div class="muted" style="margin:-8px 0 12px">${esc(v.title)}</div>
    ${typeTabs((k) => `venue.html?d=${date}&v=${code}${tq(k)}`)}
    ${races.every((r) => raceStatus(r) === "canceled") ? `<div class="card skip-note">この日のこの場は、順延・中止になりました。</div>`
      : planRows(dayStats(races), "この会場の成績")}
    <h2>レース一覧</h2>
    <div class="race-list">${rows}</div>`;
})();
</script>
</body>
</html>
