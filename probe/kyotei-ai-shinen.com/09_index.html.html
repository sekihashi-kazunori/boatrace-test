<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<meta name="description" content="展示航走まで見てから、AIが全レースの3連単を予想。的中特化型・絞り込み型・一撃重視型の3タイプの買い目と、結果・的中率・回収率をすべて公開します。">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b5cad">
<meta property="og:type" content="website">
<meta property="og:site_name" content="競艇AI予想「深淵」">
<meta property="og:title" content="競艇AI予想「深淵」— 展示航走まで見てから、AIが全レースを予想">
<meta property="og:description" content="AIが全レースの3連単を締切前に予想。的中特化型・絞り込み型・一撃重視型の3タイプの買い目と、結果・的中率・回収率をすべて公開します。">
<meta property="og:url" content="https://kyotei-ai-shinen.com/">
<meta property="og:image" content="https://kyotei-ai-shinen.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/style.css?v=51a8481b">
</head>
<body>
<div id="header"></div>
<main><div class="wrap" id="main"><div class="empty">読み込み中…</div></div></main>
<div id="footer"></div>
<script src="assets/app.js?v=b377d486"></script>
<script>
header("home");
(async () => {
  const main = document.getElementById("main");
  let index, perf = null;
  try { index = await getJSON("index.json"); } catch { return fail(main, "データを読み込めませんでした"); }
  try { perf = await getJSON("perf.json"); } catch {}
  if (!index.days.length) {
    main.innerHTML = `${brandIntro("")}${recentPerf(perf)}<div class="empty">まだ予想がありません。最初の予想が出ると、ここに表示されます。</div>`;
    return;
  }
  const date = qs("d") || index.days[0].date;
  let day;
  try { day = await getJSON(`day_${date}.json`); } catch { return fail(main, "この日の予想はありません"); }

  const races = Object.values(day.races);
  // 会場ごとにまとめる(会場コード順)
  const venues = {};
  for (const r of races) (venues[r.venue_code] ||= { name: r.venue, title: r.title, grade: r.grade, dayLabel: r.day_label, races: [] }).races.push(r);

  const cards = Object.entries(venues).sort(([a], [b]) => a.localeCompare(b)).map(([code, v]) => {
    const done = v.races.filter((r) => r.result);
    const hits = done.filter(raceHit).length;   // 表示中のタイプでの的中数
    const bought = done.filter((r) => raceHit(r) !== null).length;   // 見送りを除いた、結果が出たレース
    const next = v.races.filter((r) => !r.result && !raceStatus(r)).sort((a, b) => a.race_num - b.race_num)[0];
    return `<a class="card venue-card" href="venue.html?d=${date}&v=${code}${tq()}">
      <div class="vc-top"><span class="name">${esc(v.name)}${grade(v.grade)}</span><span class="day-label">${esc(v.dayLabel || "")}</span></div>
      <div class="title">${esc(v.title) || "&nbsp;"}</div>
      <div class="vc-bottom">
        <span class="vc-hits">${v.races.every((r) => raceStatus(r) === "canceled") ? `<span class="muted">中止</span>`
          : done.length && !bought ? `<span class="muted">参戦なし</span>` : `<b>${hits}</b>/${bought}R 的中`}</span>
        <span class="muted small">${next ? `次 ${next.race_num}R ${esc(next.deadline || "")}` : `全${v.races.length}R終了`}</span>
      </div>
    </a>`;
  }).join("");

  main.innerHTML = `
    ${brandIntro(date)}
    ${recentPerf(perf)}
    <div class="home">
      <aside>${dateList(index.days, date)}</aside>
      <section>
        <h1>${fmtDate(date)}の予想</h1>
        ${planRows(dayStats(races), "この日の成績")}
        <h2>開催場<span class="muted small">　的中数は${T_NAME}</span></h2>
        <div class="grid venues">${cards}</div>
        <h2>AI注目レース</h2>
        ${focusRaces(races, date)}
        <div class="home-links">
          <a class="card" href="about.html"><b>このサイトの考え方</b><span class="muted small">直前予想・3つの買い方・予想を変えない仕組み</span></a>
          <a class="card" href="faq.html"><b>よくある質問・用語</b><span class="muted small">3タイプの違い、フォーメーションの読み方など</span></a>
          <a class="card" href="venues.html"><b>会場データ</b><span class="muted small">場ごとの1号艇1着率と、AIの的中率</span></a>
        </div>
      </section>
    </div>`;
  // 広い画面では日付の一覧を最初から開いておく
  if (matchMedia("(min-width: 900px)").matches) document.querySelector(".datelist").open = true;
})();

// 直近7日(7日に満たなければ公開からの全日)の3タイプの成績
function recentPerf(perf) {
  if (!perf || !perf.days) return comingSoon("直近7日の成績", "最初の1日分の結果がそろいしだい、3タイプの的中率と回収率をここに出します。");
  const label = perf.days >= perf.last_days ? `直近${perf.last_days}日の成績` : `公開から${perf.days}日間の成績`;
  return `<div class="card recent-perf">
    <div class="rp-title">${label}</div>
    <div class="rp-grid">${perf.plans.map((p) => `
      <a class="rp-item ${p.key === T ? "on" : ""}" href="performance.html?${p.key === "hit" ? "" : `t=${p.key}`}">
        <div class="rp-name">${esc(p.name)}</div>
        <div class="rp-nums"><div><small>的中率</small><b>${f1(p.last7.rate)}<i>%</i></b></div><div><small>回収率</small><b>${f1(p.last7.roi)}<i>%</i></b></div></div>
        <div class="muted small">${p.last7.hits}的中 / ${p.last7.races}R</div>
      </a>`).join("")}</div>
  </div>`;
}

// 本番で通知している条件(AIの1着確率が特に高いなど)を満たしたレース。締切の早い順
// 最初に見せるのは、これから締切のレースを5件(全部終わった日は最後の5件)。残りは「すべて見る」で開く
const FOCUS_SHOW = 5;
function focusRaces(races, date) {
  const list = races.filter((r) => (r.strategies || []).length).sort((a, b) => (a.deadline || "").localeCompare(b.deadline || ""));
  if (!list.length) return `<p class="muted small">この日はまだ該当するレースがありません。AIの1着確率が特に高いなど、条件を満たしたレースがここに並びます。</p>`;
  const upcoming = list.filter((r) => !r.result);
  const first = upcoming.length ? upcoming.slice(0, FOCUS_SHOW) : list.slice(-FOCUS_SHOW);
  const rest = list.filter((r) => !first.includes(r));
  const row = (r) => {
    const hb = r.boats.find((b) => b.boat === r.honmei) || {};
    const pl = planOf(r);
    return `<a class="fl-row" href="race.html?d=${date}&v=${r.venue_code}&r=${r.race_num}${tq()}">
      <span class="fl-time">${esc(r.deadline || "-")}</span>
      <span class="fl-race">${esc(r.venue)} ${r.race_num}R</span>
      <span class="fl-honmei">${lane(r.honmei)}<span class="muted small">${pct(hb.p1)}</span></span>
      <span class="fl-form">${pl && !pl.skip ? esc(pl.form) + (planLines(pl).length > 1 ? " 他" : "") : ""}</span>
      <span class="fl-res">${resultBadge(r)}</span>
    </a>`;
  };
  return `<div class="card focus-list">${first.map(row).join("")}
    ${rest.length ? `<details class="fl-more"><summary>すべて見る(全${list.length}件)</summary>${rest.map(row).join("")}</details>` : ""}</div>
  <p class="muted small">AIの1着確率が特に高いなど、本番で通知している条件を満たしたレースです。${upcoming.length ? "これから締切のレースから順に出しています。" : ""}</p>`;
}
</script>
</body>
</html>
