name: asoka yosou hozon (あそかぶの予想を保存)

# 2026-10-21 ご主人様OK: あそかぶ(a-so-ka.work)の無料予想を紙上で採点する。
# 朝7:10に当日の予想(3連単1点・信頼度A〜E)を asoka/日付.csv に保存。
# 採点は翌朝8:00の全国答え合わせ(rule_check.yml)の中で行う。
on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * *"   # 日本時間 7:10

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -u -m src.tools.asoka fetch
      - name: hozon
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          git add asoka
          git commit -q -m "chore: asoka yosou $(TZ=Asia/Tokyo date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
