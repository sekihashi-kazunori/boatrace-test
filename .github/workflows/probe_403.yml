name: probe 403 (公式サイトが弾く原因の切り分け)
on:
  workflow_dispatch:
jobs:
  t:
    strategy:
      matrix:
        py: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - run: pip install requests >/dev/null 2>&1; python -c "import requests,sys;r=requests.get('https://www.boatrace.jp/owpc/pc/race/index?hd=20261118',headers={'User-Agent':'Mozilla/5.0 (boatrace-test research)'},timeout=20);print('RESULT',sys.version.split()[0],r.status_code)"
