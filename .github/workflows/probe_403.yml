name: probe 403 (公式サイトが弾く原因の切り分け)
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv /tmp/v && . /tmp/v/bin/activate && python --version
          pip install -q -e . 2>&1 | tail -3
          python -c "import requests,sys;r=requests.get('https://www.boatrace.jp/owpc/pc/race/index?hd=20261118',headers={'User-Agent':'Mozilla/5.0 (boatrace-test research)'},timeout=20);print('RESULT venv',sys.version.split()[0],r.status_code)"
          python -c "from src.models import ai3; m=ai3.load(); print('RESULT model', type(m).__name__)" 2>&1 | tail -2
          python -c "import src.pipeline.final_pipeline as f; print('RESULT import ok')" 2>&1 | tail -2
