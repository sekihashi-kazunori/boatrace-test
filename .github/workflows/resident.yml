name: jouchuu mihari (3-pun oki)

# 2026-10-15: GitHubの「5分おき」cronが実際は20〜100分おきにしか動かず、
# 1日65Rも取りこぼしたため、1本のジョブが朝から夜まで起きっぱなしで
# 3分おきに最終予想を回す方式に変更(公開リポジトリなので実行時間は無料)。
# 1時間おきに起動をかけ、同時に走るのは1本だけ(後続は待機して、前のが終わったら即交代)。
on:
  schedule:
    - cron: "3 22,23,0-12 * * *"   # JST 7:03〜21:03 毎時
  workflow_dispatch:

concurrency:
  group: resident
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: mihari loop
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          START=$(date +%s)
          save() {
            git checkout -- boatrace.db 2>/dev/null || true
            git add plans state.db logs rule_eval.csv asoka_eval.csv racer_hist.csv tanfuku_eval.csv 2>/dev/null || true
            git commit -q -m "chore: $1 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')" || return 0
            for i in 1 2 3 4 5; do
              git pull -q --rebase --autostash && git push -q && return 0
              sleep $((i * 5))
            done
          }
          while true; do
            NOW=$(TZ=Asia/Tokyo date +%H%M)
            ELAPSED=$(( ($(date +%s) - START) / 60 ))
            # 夜中(0:00〜6:30)に遅れて起動した場合もすぐ終了する(10/16夜、3時間遅れの起動が朝まで空回りした)
            # 2026-11-03: GitHubの定時起動が何時間も遅れる(11/3は朝7時の見張りが10時半になっても起動せず、モーニング・デイの予想も全滅)。
            # 定時に頼らず、見張りが夜も眠ったまま居続け、5時間40分ごとに次の見張りを自分で起動してつなぐ。
            if [ "$ELAPSED" -ge 340 ]; then
              echo "交代 $NOW ${ELAPSED}分"
              GH_TOKEN="${{ github.token }}" gh workflow run resident.yml --ref main || true
              break
            fi
            if (( 10#$NOW >= 2330 || 10#$NOW < 630 )); then sleep 600; continue; fi
            git checkout -- boatrace.db 2>/dev/null || true
            git pull -q --rebase --autostash || true
            mkdir -p logs
            python -u -m src.pipeline.final_pipeline > logs/last_final.txt 2>&1 || echo "final失敗" >> logs/last_final.txt
            tail -n 40 logs/last_final.txt
            save "all final"
            TODAY=$(TZ=Asia/Tokyo date +%F)
            # 2026-11-03: 厳選(予想の候補づくり)も見張りが自分で行う(定時の session_automation が遅れても間に合うように)
            for SP in "morning 650" "day 1030" "nighter 1530"; do
              set -- $SP
              if (( 10#$NOW >= 10#$2 )) && [ ! -f "plans/${TODAY}_$1.json" ]; then
                python -u -m src.pipeline.session_pipeline --session $1 || true
                save "$1 predict"
              fi
            done
            # 2026-11-02: 朝の答え合わせ(rule_check.yml)がGitHubの起動遅れで毎日3時間遅れ(11時台)ていたため、見張り側で7:30〜に1回だけ実行
            YDAY=$(TZ=Asia/Tokyo date -d yesterday +%F)
            if (( 10#$NOW >= 730 )) && [ ! -f "plans/${YDAY}_kotaeawase" ]; then
              python -u -m src.tools.rule_check --date "$YDAY" || true
              python -u -m src.tools.series_form --date "$YDAY" || true
              python -u -m src.tools.tanfuku_check --date "$YDAY" || true
              touch "plans/${YDAY}_kotaeawase"
              save "morning kotaeawase"
            fi
            # モーニング精算 15:00〜 / デイ精算 18:30〜(1日1回だけ。印のファイルで二重報告を防ぐ)
            if (( 10#$NOW >= 1500 )) && [ ! -f "plans/${TODAY}_settled_morning" ]; then
              python -u -m src.pipeline.settle_pipeline --session morning && touch "plans/${TODAY}_settled_morning"
              save "morning settle"
            fi
            if (( 10#$NOW >= 1830 )) && [ ! -f "plans/${TODAY}_settled_day" ]; then
              python -u -m src.pipeline.settle_pipeline --session day && touch "plans/${TODAY}_settled_day"
              save "day settle"
            fi
            # ナイター精算＋最終収支報告 22:00〜(10/16はGitHubの23時の定時実行が丸ごと飛んだため常駐側に移管)
            if (( 10#$NOW >= 2200 )) && [ ! -f "plans/${TODAY}_settled_nighter" ]; then
              python -u -m src.pipeline.settle_pipeline --session nighter --last-of-day && touch "plans/${TODAY}_settled_nighter"
              save "nighter settle"
            fi
            sleep 180
          done
