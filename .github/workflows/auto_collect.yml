name: auto collect (オートレースの結果と払戻を集める)

# 2026-11-06 ご主人様OK「オートレースもやってみて」: 研究用・私的利用。
# autorace.jp のレース結果APIを1.2秒に1回読む。止められたらそこで終わる。続きは再実行で再開。
on:
  workflow_dispatch:
    inputs:
      start:
        default: "2024-11-01"
      end:
        default: "2026-11-05"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -m src.tools.auto_collect --start "${{ inputs.start }}" --end "${{ inputs.end }}" --max-minutes 300
      - name: save
        if: always()
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          git add auto
          git commit -q -m "chore: auto data" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
