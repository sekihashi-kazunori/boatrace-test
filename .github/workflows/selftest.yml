name: dousa kakunin (v2)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python (システムのPythonを使う。2026-11-18 setup-pythonのPythonだと公式サイトが403で弾く)
        run: python3 -m venv "$HOME/venv" && echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e .
      - run: python -u -m src.tools.selftest_v2
      - run: python -u -m src.tools.odds_diag
      - name: kekka hozon
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          git add selftest_v2.txt odds_diag.txt
          git commit -m "chore: v2 selftest" || exit 0
          git pull --rebase --autostash -q && git push
