name: tipster report (予想屋さんの採点だけを今すぐ実行・通知なし)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: python (システムのPythonを使う。2026-11-18 setup-pythonのPythonだと公式サイトが403で弾く)
        run: python3 -m venv "$HOME/venv" && echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e .
      - run: python -u -m src.reporting.tipsters --date "${{ inputs.date }}"
      - name: hozon
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          git add plans/tipster_eval.csv
          git commit -q -m "chore: tipster report ${{ inputs.date }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
