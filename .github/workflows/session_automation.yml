name: kyoutei test yosou 3-bu-sei jidou jikkou

on:
  schedule:
    - cron: "50 23 * * *"
    - cron: "30 1 * * *"
    - cron: "30 6 * * *"
    - cron: "0 6 * * *"
    - cron: "30 9 * * *"
    - cron: "0 14 * * *"
    # 展示タイム後の最終予想: JST 8:00〜21:55 の5分おき
    - cron: "*/5 23,0-12 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "taishou session"
        required: true
        default: "morning"
        type: choice
        options: [morning, day, nighter]
      action:
        description: "predict or settle"
        required: true
        default: "predict"
        type: choice
        options: [predict, final, settle]

# 同時に複数回走るとDBの書き込みが競合するため、1本ずつ順番に実行する
concurrency:
  # predict(厳選)は plans/ だけ、final・settle は state.db だけを書くので、
  # 書き込み先ごとにグループを分けて互いに待たせない
  group: ${{ (github.event.schedule == '50 23 * * *' || github.event.schedule == '30 1 * * *' || github.event.schedule == '30 6 * * *' || inputs.action == 'predict') && 'plan' || 'state' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: session/action hantei
        id: vars
        run: |
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "session=${{ inputs.session }}" >> "$GITHUB_OUTPUT"
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            fi
            case "${{ github.event.schedule }}" in
            "50 23 * * *") echo "session=morning" >> "$GITHUB_OUTPUT"; echo "action=predict" >> "$GITHUB_OUTPUT" ;;
            "30 1 * * *")  echo "session=day"     >> "$GITHUB_OUTPUT"; echo "action=predict" >> "$GITHUB_OUTPUT" ;;
            "30 6 * * *")  echo "session=nighter" >> "$GITHUB_OUTPUT"; echo "action=predict" >> "$GITHUB_OUTPUT" ;;
            "0 6 * * *")  echo "session=morning" >> "$GITHUB_OUTPUT"; echo "action=settle"  >> "$GITHUB_OUTPUT" ;;
            "30 9 * * *")  echo "session=day"     >> "$GITHUB_OUTPUT"; echo "action=settle"  >> "$GITHUB_OUTPUT" ;;
            "0 14 * * *")  echo "session=nighter" >> "$GITHUB_OUTPUT"; echo "action=settle"  >> "$GITHUB_OUTPUT" ;;
            "*/5 23,0-12 * * *") echo "session=all" >> "$GITHUB_OUTPUT"; echo "action=final" >> "$GITHUB_OUTPUT" ;;
            esac



      - name: yosou kaime seisei
        if: steps.vars.outputs.action == 'predict'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: python -u -m src.pipeline.session_pipeline --session ${{ steps.vars.outputs.session }}

      - name: tenji-go saishuu yosou
        if: steps.vars.outputs.action == 'final'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u -m src.pipeline.final_pipeline

      - name: kekka kakutei shuushi houkoku
        if: steps.vars.outputs.action == 'settle'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.vars.outputs.session }}" = "nighter" ]; then
            python -m src.pipeline.settle_pipeline --session nighter --last-of-day
          else
            python -m src.pipeline.settle_pipeline --session ${{ steps.vars.outputs.session }}
          fi

      - name: kekka hozon
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          # boatrace.db(36MB)はコミットしない。保存するのは厳選リストと state.db だけ
          git add plans state.db 2>/dev/null || true
          git commit -m "chore: ${{ steps.vars.outputs.session }} ${{ steps.vars.outputs.action }} $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
