name: zenkaijou rule kotaeawase

on:
  schedule:
    - cron: "0 23 * * *"   # JST 8:00 に前日分を答え合わせ
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (empty=yesterday)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: kotaeawase
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then python -u -m src.tools.rule_check --date "${{ inputs.date }}"; else python -u -m src.tools.rule_check; fi
      - name: konsetsu (今節の調子用に前日の着順を保存)
        run: python -u -m src.tools.series_form || true
      - name: asoka saiten (あそかぶ予想の答え合わせ)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then python -u -m src.tools.asoka eval --date "${{ inputs.date }}" || true; else python -u -m src.tools.asoka eval || true; fi
      - name: yosouya (予想屋さんの前日分を結果待ち込みで埋め直す・通知なし)
        run: |
          if [ -n "${{ inputs.date }}" ]; then python -u -m src.reporting.tipsters --date "${{ inputs.date }}" || true; else python -u -m src.reporting.tipsters || true; fi
      - name: hozon
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          git checkout -- boatrace.db 2>/dev/null || true
          for f in rule_eval.csv asoka_eval.csv racer_hist.csv plans/tipster_eval.csv; do [ -f "$f" ] && git add "$f"; done
          git commit -q -m "chore: rule kotaeawase $(TZ=Asia/Tokyo date +'%Y-%m-%d')" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
