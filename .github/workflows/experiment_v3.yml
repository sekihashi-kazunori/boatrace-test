name: experiment v3

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -u -m src.experiments.v3
      - name: hozon
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          git add experiments
          git commit -q -m "chore: experiment v3 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
