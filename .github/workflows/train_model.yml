name: kyoutei model gakushuu

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: model gakushuu (v2 1-2-3 chaku model)
        run: python -u -m src.models.train_v2

      - name: model eizokuka
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@example.com"
          git add model_v2
          git commit -m "chore: model v2 gakushuu $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
